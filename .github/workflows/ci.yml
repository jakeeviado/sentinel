name: TEST-LINT-BUILD

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: Check out code
              uses: actions/checkout@v4
            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test -v -race -coverprofile=coverage.out ./...

            - name: Upload coverage
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.out

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: golangci-lint
              uses: golangci/golangci-lint-action@v6
              with:
                  version: latest

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [test, lint]
        strategy:
            matrix:
                goos: [linux, darwin, windows]
                goarch: [amd64, arm64]
                exclude:
                    - goos: windows
                      goarch: arm64
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  if [ "$GOOS" = "windows" ]; then
                    go build -o bin/sentinel-${{ matrix.goos }}-${{ matrix.goarch }}.exe
                  else
                    go build -o bin/sentinel-${{ matrix.goos }}-${{ matrix.goarch }}
                  fi

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: sentinel-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: bin/sentinel-*
